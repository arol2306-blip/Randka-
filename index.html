<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Najpiękniejsza Emilko...</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            overflow: hidden;
            position: relative;
        }

        /* Tło z unoszącymi się serduszkami */
        .hearts-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .heart-particle {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 255, 255, 0.6);
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-105vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Główna karta */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 105, 135, 0.2);
            text-align: center;
            max-width: 480px;
            width: 90%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            transition: all 0.5s ease;
        }

        .card-icon {
            font-size: 50px;
            color: #ff477e;
            margin-bottom: 20px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
        }

        h1 {
            color: #d90429;
            font-size: 26px;
            margin-bottom: 35px;
            line-height: 1.4;
            font-weight: 700;
        }

        /* Przyciski */
        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            min-height: 70px;
        }

        .btn {
            padding: 14px 32px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff477e 0%, #ff758c 100%);
            color: white;
            z-index: 5;
            animation: pulseYes 1.5s infinite;
        }

        @keyframes pulseYes {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 126, 0.5); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 71, 126, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 126, 0); }
        }

        .btn-no {
            background: #e0e0e0;
            color: #555;
            position: absolute;
            transition: 0.15s ease-out;
        }

        /* Ekran sukcesu */
        .success-screen {
            display: none;
            text-align: center;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .success-screen h2 {
            color: #d90429;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .success-screen p {
            color: #444;
            font-size: 18px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn-fb {
            display: inline-block;
            background: #1877f2;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 5px 20px rgba(24, 119, 242, 0.3);
            transition: transform 0.2s, background 0.2s;
        }

        .btn-fb:hover {
            background: #145dbf;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Tło ze spadającymi serduszkami -->
    <div class="hearts-bg" id="heartsBg"></div>

    <div class="card" id="mainCard">
        <div class="card-icon">
            <i class="fa-solid fa-heart"></i>
        </div>
        
        <!-- Pytanie początkowe -->
        <div id="questionContainer">
            <h1>Najpiękniejsza Emilko, czy chcesz ze mną wyjść na najlepsze spotkanie w Twoim życiu?</h1>
            <div class="buttons-container" id="buttonsContainer">
                <button class="btn btn-yes" id="yesBtn">TAK! ❤️</button>
                <button class="btn btn-no" id="noBtn">Nie</button>
            </div>
        </div>

        <!-- Ekran po kliknięciu TAK -->
        <div class="success-screen" id="successContainer">
            <h2>Hura! To będzie niesamowity czas! 🥰</h2>
            <p>Napisz teraz do najukochańszego Areczka na świecie i ustalmy szczegóły:</p>
            <a href="https://www.facebook.com/arek.gierak.3/" target="_blank" class="btn-fb">
                <i class="fa-brands fa-facebook" style="margin-right: 8px;"></i> Napisz do Areczka
            </a>
        </div>
    </div>

    <script>
        // Generowanie tła z unoszącymi się serduszkami
        const heartsBg = document.getElementById('heartsBg');
        const symbols = ['❤️', '💖', '💘', '💕', '✨', '🌸'];
        
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heartsBg.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }
        setInterval(createHeart, 400);

        // Logika uciekającego przycisku NIE
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionContainer = document.getElementById('questionContainer');
        const successContainer = document.getElementById('successContainer');
        const mainCard = document.getElementById('mainCard');

        let noClickCount = 0;
        const noTexts = ["Nie", "Na pewno?", "Przemyśl to! 🥺", "Emilka, proszę! 😭", "Zmień zdanie!", "Nie masz wyjścia ❤️"];

        function moveNoButton() {
            // Losowa pozycja w obrębie ekranu
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            // Zmiana tekstu i pomniejszanie przycisku
            noClickCount++;
            if (noClickCount < noTexts.length) {
                noBtn.innerText = noTexts[noClickCount];
            }
            
            let currentScale = Math.max(0.6, 1 - (noClickCount * 0.07));
            noBtn.style.transform = `scale(${currentScale})`;

            // Przycisk TAK rośnie, zachęcając do kliknięcia
            let yesScale = 1 + (noClickCount * 0.1);
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        // Obsługa najechania myszką lub dotknięcia na telefonie
        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // Obsługa kliknięcia TAK
        yesBtn.addEventListener('click', () => {
            questionContainer.style.display = 'none';
            successContainer.style.display = 'block';
            mainCard.style.background = 'rgba(255, 255, 255, 0.95)';

            // Odpalenie konfetti
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#ff477e', '#ff758c', '#ffffff', '#ff9a9e']
            });

            // Dodatkowe kolorowe konfetti po chwili
            setTimeout(() => {
                confetti({
                    particleCount: 100,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 100,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });
            }, 400);
        });
    </script>
</body>
</html>
